<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Permanent+Marker&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Noughts and Crosses</h1>
    <section id="start-section">
      <form id="name-form">
        <div class="player-field">
          <label for="player-one-name">Player 1 (X)</label>
          <input
            type="text"
            id="player-one-name"
            name="playerOne"
            maxlength="15"
            autofocus
            placeholder="Player One" />
        </div>

        <div class="player-field">
          <label for="player-two-name">Player 2 (O)</label>
          <input
            type="text"
            id="player-two-name"
            name="playerTwo"
            maxlength="15"
            placeholder="Player Two" />
        </div>

        <button type="submit" class="btn start-button">Start Game!</button>
      </form>
    </section>
    <section id="game-section" hidden>
      <div id="gameboard"></div>
      <div id="status"></div>
      <div class="game-controls">
        <button id="restart-btn" class="btn">Restart</button>
        <button id="change-players-btn" class="btn">Change Players</button>
      </div>
    </section>
  </body>
</html>
